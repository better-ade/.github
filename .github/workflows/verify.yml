# Reusable CI: run a repo's verification command and a gitleaks scan.
name: verify
on:
  workflow_call:
    inputs:
      command: { type: string, required: true, description: "The repo's verification command" }
      runs-on: { type: string, default: ubuntu-latest }
      setup: { type: string, default: "", description: "Optional shell lines run before the command" }
      timeout-minutes: { type: number, default: 45, description: "The job is cancelled after this many minutes (a hung test must not hold a runner for six hours)" }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          os=$(uname -s | tr A-Z a-z); arch=$(uname -m); case "$arch" in x86_64) arch=x64;; aarch64|arm64) arch=arm64;; esac
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${os}_${arch}.tar.gz" | tar xz gitleaks
          ./gitleaks git . --no-banner --redact --log-level warn && rm gitleaks
      - name: setup
        if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - name: verification command
        run: ${{ inputs.command }}
